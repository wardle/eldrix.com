  # Disclosures) Regulations 2015, regs 24-25). Shown in the footer and
  # on the About page when set.
  company_name = "Eldrix Ltd"
  company_number = "09049500"
  registered_in = "England and Wales"
  registered_office = ""

[[menus.main]]
  name = "Software"
  pageRef = "/software"
  weight = 10

[[menus.main]]
