baseURL = "https://eldrix.com/"
locale = "en-GB"
title = "Eldrix"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  description = "Eldrix Ltd makes electronic patient record software and open-source tools for health and care data."
  github = "https://github.com/wardle"

  # Contact address. Leave empty to hide the Contact link and call-to-action buttons.
  email = "mark@eldrix.co.uk"

  # UK companies must show their registered name, number, place of registration
